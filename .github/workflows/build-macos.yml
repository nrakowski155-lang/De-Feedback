name: Build macOS (AU + VST3)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AU + VST3 (universal)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version
          uname -m

      - name: Check training pipeline (syntax)
        run: |
          python3 -m py_compile training/*.py
          echo "training scripts parse"

      - name: Check helper scripts (syntax)
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          echo "installer scripts parse"

      - name: Smoke test training pipeline
        run: |
          python3 -m venv .venv-training
          . .venv-training/bin/activate
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy
          python training/synthesize.py --patches 12 --seed 1 --out /tmp/resonanceai_smoke.npz
          python - <<'PY'
          import numpy as np

          data = np.load("/tmp/resonanceai_smoke.npz")
          x, y, c = data["x"], data["y"], data["c"]

          assert x.shape == (12, 64, 256), x.shape
          assert y.shape == (12, 64), y.shape
          assert c.shape == (12,), c.shape
          assert x.min() >= 0.0 and x.max() <= 1.0
          assert y.min() >= 0.0 and y.max() <= 1.0
          assert (c > 0).any(), "smoke sample contains no positive patch"
          print("training smoke OK:", x.shape, "positives:", int((c > 0).sum()))
          PY

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DDEFB_BUILD_TESTS=ON \
            -DDEFB_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: Run DSP tests
        run: |
          set +e
          ./build/defb_dsp_tests > /tmp/dsp-tests.log 2>&1
          status=$?
          cat /tmp/dsp-tests.log
          # the job log needs admin rights, the run summary is readable by anyone
          {
            echo "## DSP tests (exit ${status})"
            echo '```'
            tail -n 120 /tmp/dsp-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${status}

      - name: Check binary architectures
        run: |
          lipo -info build/DeFeedback_artefacts/Release/AU/De-Feedback.component/Contents/MacOS/De-Feedback
          lipo -info build/DeFeedback_artefacts/Release/VST3/De-Feedback.vst3/Contents/MacOS/De-Feedback

      - name: Ad-hoc sign bundles
        run: |
          codesign --force --deep --sign - build/DeFeedback_artefacts/Release/AU/De-Feedback.component
          codesign --force --deep --sign - build/DeFeedback_artefacts/Release/VST3/De-Feedback.vst3
          codesign --verify --deep --strict --verbose=2 build/DeFeedback_artefacts/Release/AU/De-Feedback.component

      - name: Install with the installer script
        run: |
          ./scripts/install-macos.sh --system --from build/DeFeedback_artefacts/Release --skip-auval

      # auval needs a real audio session; on the headless runner it aborts even
      # for plug-ins that validate fine on a workstation. The result is reported
      # as an annotation instead of blocking the packages and the release.
      - name: Validate Audio Unit with auval (diagnostic)
        id: auval
        continue-on-error: true
        run: |
          set +e
          output="$(auval -v aufx Dfb1 Dfbk 2>&1)"
          status=$?
          printf '%s\n' "${output}"
          {
            echo "### auval -v aufx Dfb1 Dfbk (exit ${status})"
            echo '```'
            printf '%s\n' "${output}" | tail -n 25
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${status}" -ne 0 ]; then
            printf '%s\n' "${output}" | tail -n 25 | while IFS= read -r line; do
              printf '::warning::auval exit %s: %s\n' "${status}" "${line}"
            done
            echo "::warning::auval meldet exit ${status}. Pakete und Release werden trotzdem gebaut."
          else
            echo "auval OK"
          fi
          exit 0

      - name: Uninstall with the uninstaller script
        run: |
          ./scripts/uninstall-macos.sh --system

      - name: Build installer packages
        run: |
          ./scripts/build-pkg.sh --from build/DeFeedback_artefacts/Release --out artifacts
          ls -lh artifacts
          for pkg in artifacts/*.pkg; do
            echo "--- $pkg"
            pkgutil --payload-files "$pkg" 2>/dev/null | sed -n '1,8p' || true
          done

      - name: Build bootstrap installer package
        run: ./scripts/build-bootstrap-pkg.sh --out artifacts

      - name: Package
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d build/DeFeedback_artefacts/Release/AU/De-Feedback.component ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              build/DeFeedback_artefacts/Release/AU/De-Feedback.component \
              artifacts/De-Feedback-AU-macOS-universal.zip
          fi
          if [ -d build/DeFeedback_artefacts/Release/VST3/De-Feedback.vst3 ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              build/DeFeedback_artefacts/Release/VST3/De-Feedback.vst3 \
              artifacts/De-Feedback-VST3-macOS-universal.zip
          fi
          ls -lh artifacts

      - name: Prepare release assets
        if: github.event_name != 'pull_request'
        run: |
          installer="$(ls artifacts/De-Feedback-[0-9]*.pkg | head -n 1)"
          uninstaller="$(ls artifacts/De-Feedback-Uninstall-*.pkg | head -n 1)"
          test -n "$installer"
          test -n "$uninstaller"
          test -f artifacts/De-Feedback-Installer.pkg
          cp "$installer" artifacts/De-Feedback.pkg
          cp "$uninstaller" artifacts/De-Feedback-Uninstall.pkg
          (cd artifacts && shasum -a 256 \
            De-Feedback.pkg \
            De-Feedback-Uninstall.pkg \
            De-Feedback-Installer.pkg \
            De-Feedback-AU-macOS-universal.zip \
            De-Feedback-VST3-macOS-universal.zip > SHA256SUMS)
          cat artifacts/SHA256SUMS

      - name: Publish rolling latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "De-Feedback – neuester Build" \
              --notes "Rolling Build von main. Enthält De-Feedback-Installer.pkg (lädt beim Installieren die aktuellen Bundles), De-Feedback.pkg, Deinstaller, ZIPs und SHA256SUMS." \
              --target "$GITHUB_SHA"
          fi
          gh release upload latest \
            artifacts/De-Feedback-Installer.pkg \
            artifacts/De-Feedback.pkg \
            artifacts/De-Feedback-Uninstall.pkg \
            artifacts/De-Feedback-AU-macOS-universal.zip \
            artifacts/De-Feedback-VST3-macOS-universal.zip \
            artifacts/SHA256SUMS \
            --clobber

      - name: Verify download link
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          # The HTML page is authoritative here: the anonymous REST API is rate
          # limited from shared runner IPs and answers 403, not 404.
          repo_code="$(curl -sL -o /dev/null -w '%{http_code}' "https://github.com/${GITHUB_REPOSITORY}")"
          asset="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/De-Feedback-Installer.pkg"
          asset_code=""
          for attempt in 1 2 3 4 5; do
            asset_code="$(curl -sL -o /dev/null -w '%{http_code}' "${asset}")"
            [ "${asset_code}" = "200" ] && break
            sleep 5
          done
          echo "Repository (anonym): HTTP ${repo_code}"
          echo "${asset} -> HTTP ${asset_code}"
          if [ "${repo_code}" = "200" ] && [ "${asset_code}" != "200" ]; then
            echo "::error::Download-Link liefert ${asset_code}, obwohl das Repository öffentlich ist."
            exit 1
          fi
          if [ "${repo_code}" != "200" ]; then
            echo "::warning::Repository ist für anonyme Aufrufe nicht erreichbar (HTTP ${repo_code}) – der Download-Link bleibt dann 404."
          fi

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "De-Feedback $GITHUB_REF_NAME" \
              --notes "macOS Universal-Build (AU + VST3), ad-hoc signiert und nicht notarisiert. De-Feedback-Installer.pkg lädt beim Installieren die aktuellen Bundles; De-Feedback.pkg enthält sie direkt." \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/De-Feedback-Installer.pkg \
            artifacts/De-Feedback.pkg \
            artifacts/De-Feedback-Uninstall.pkg \
            artifacts/De-Feedback-AU-macOS-universal.zip \
            artifacts/De-Feedback-VST3-macOS-universal.zip \
            artifacts/SHA256SUMS \
            --clobber

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: De-Feedback-macOS
          path: |
            artifacts/*.zip
            artifacts/*.pkg
            artifacts/SHA256SUMS
          if-no-files-found: warn
          retention-days: 30
